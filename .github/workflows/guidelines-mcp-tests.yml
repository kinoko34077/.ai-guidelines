name: Guidelines MCP regression

on:
  pull_request:
    paths:
      - "guidelines_mcp.py"
      - "test_guidelines_mcp_security.py"
      - "guidelines/AI_AGENT_BOOTSTRAP_POLICY.md"
      - "guidelines/REFACTORING_OPTIMIZATION_STANDARD.md"
      - ".github/workflows/guidelines-mcp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidelines-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documented MCP dependency
        run: python -m pip install "mcp[cli]>=2,<3"
      - name: Validate Python syntax
        run: python -m py_compile guidelines_mcp.py test_guidelines_mcp_security.py
      - name: Run focused routing and filesystem containment tests
        run: python -m unittest discover -v -p "test_guidelines_mcp_security.py"
